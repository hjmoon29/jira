// QA 대응: 찾은 이슈/문의 고르기 → 답변 만들기(엑셀·메일) 또는 같은 조건으로 예약
let qa = null;
const DAYS = "월화수목금토일";
function renderQa(d) {
  qa = d; d.sel ||= new Set(d.rows.map(x => x.key));
  const J = d.kind === "jira", jira = k => `<a href="https://jira.coway.com/browse/${esc(k)}" target="_blank" rel="noopener">${esc(k)}</a>`;
  const rows = d.rows.map(x => `<tr class="${d.sel.has(x.key) ? "" : "off"}"><td><input type="checkbox" data-qk="${esc(x.key)}" ${d.sel.has(x.key) ? "checked" : ""} aria-label="${esc(x.key)} 선택"></td>
    <td class="nowrap">${J ? jira(x.key) : "#" + esc(x.key)}</td><td>${esc(x.summary)}</td><td>${esc(x.status)}</td><td>${esc(x.versions)}</td><td>${esc(x.assignee)}</td>${J ? `<td>${esc(x.labels)}</td>` : ""}<td class="nowrap">${esc(x.updated)}</td></tr>`).join("");
  const head = J ? "<th>키</th><th>요약</th><th>상태</th><th>영향받는 버전</th><th>담당자</th><th>레이블</th><th>최근 수정</th>"
                 : "<th>순번</th><th>문의내역</th><th>문의일자</th><th>산출물/화면</th><th>작성자</th><th>위치</th>";
  const t = new Date(Date.now() + 864e5), tomorrow = new Date(t - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  return `<div class="planmeta"><span>${J ? `JQL <b>${esc(d.jql)}</b>` : esc(d.note || "")}</span></div>
    ${d.rows.length ? `<div class="tbl"><table><thead><tr><th><input type="checkbox" data-qall ${d.sel.size === d.rows.length ? "checked" : ""} aria-label="전체 선택"></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`
      : '<p class="empty">조건에 맞는 건이 없습니다.</p>'}
    <div class="qabox">
      <div class="row"><label for="qa_to">결과 메일 받는 사람</label><input id="qa_to" class="qin" value="${esc(d.to || "")}" placeholder="이메일"></div>
      <div class="actions"><button class="btn danger" type="button" data-qa-run ${d.sel.size ? "" : "disabled"}>선택한 ${d.sel.size}건 답변 만들기 · 엑셀 메일 발송</button>
        <span class="note" style="margin:0">건수에 따라 5~20분 걸립니다. ${J ? "Jira" : "문의 문서"}에는 쓰지 않습니다.</span></div>
      <h3>이 조건으로 예약 발송 <small>예약 시각마다 같은 조건으로 다시 찾아 답변을 만들고 메일로 보냅니다${J ? " (위 선택과 관계없이 조건 전체)" : ""}.</small></h3>
      <div class="sched">
        <select id="qa_mode" aria-label="반복"><option value="once">한 번</option><option value="daily">매일</option><option value="weekdays" selected>평일</option><option value="weekly">매주</option></select>
        <input type="date" id="qa_date" value="${tomorrow}" aria-label="날짜">
        <span id="qa_days">${[...DAYS].map((x, i) => `<label class="check"><input type="checkbox" value="${i}"${i === 0 ? " checked" : ""}>${x}</label>`).join("")}</span>
        <input type="time" id="qa_time" value="09:00" aria-label="시각">
        <input id="qa_label" class="qin" placeholder="예약 이름 (선택)" aria-label="예약 이름">
        <button class="btn" type="button" data-qa-sched>예약 저장</button>
      </div>
    </div>`;
}
function syncSched() {
  const m = $("qa_mode"); if (!m) return;
  $("qa_date").hidden = m.value !== "once"; $("qa_days").hidden = m.value !== "weekly";
}
function renderSchedules(list) {
  if (!list.length) return '<p class="empty">예약이 없습니다. Jira 이슈 답변·문의사항 답변에서 조건을 찾은 뒤 [예약 저장]을 누르세요.</p>';
  return `<div class="tbl"><table><thead><tr><th>예약</th><th>반복</th><th>다음 실행</th><th>마지막 실행</th><th>받는 사람</th><th></th></tr></thead><tbody>${list.map(j => `<tr>
    <td><b>${esc(j.label)}</b><br><small class="muted">${j.kind === "jira" ? "Jira " + esc(j.params.project || "") : esc(j.params.doc || "").slice(0, 60)}</small></td>
    <td>${esc(j.when_text)}</td><td class="nowrap">${esc(j.next_run || "끝남")}</td>
    <td>${j.last_run ? `${esc(j.last_run)}<br><small class="muted">${esc(j.last_result || "")}</small>` : "-"}</td><td>${esc(j.to)}</td>
    <td class="nowrap"><button class="btn" type="button" data-qa-now="${esc(j.id)}">지금 실행</button> <button class="btn" type="button" data-qa-del="${esc(j.id)}">삭제</button></td></tr>`).join("")}</tbody></table></div>
    <p class="note">PC가 켜져 있으면 IoT업무봇 화면을 닫아도 10분 간격으로 확인해 실행합니다. 꺼져 있던 동안 지난 예약은 켜진 뒤 한 번 실행합니다.</p>`;
}
$("result").addEventListener("change", e => {
  if (e.target.id === "qa_mode") return syncSched();
  if (!qa || !(e.target.dataset.qk || e.target.hasAttribute("data-qall"))) return;
  if (e.target.hasAttribute("data-qall")) qa.sel = new Set(e.target.checked ? qa.rows.map(x => x.key) : []);
  else e.target.checked ? qa.sel.add(e.target.dataset.qk) : qa.sel.delete(e.target.dataset.qk);
  const keep = { to: $("qa_to").value };
  $("result").innerHTML = renderQa(qa); $("qa_to").value = keep.to; syncSched();
});
$("result").addEventListener("click", async e => {
  const run = e.target.closest("[data-qa-run]"), sch = e.target.closest("[data-qa-sched]"), now = e.target.closest("[data-qa-now]"), del = e.target.closest("[data-qa-del]");
  if (!(run || sch || now || del) || busy) return;
  let act, params;
  if (run) {
    const to = $("qa_to").value.trim();
    if (!confirm(`${qa.sel.size}건의 답변 초안을 만들어 엑셀로 정리하고 ${to || "기본 주소"} 로 메일을 보냅니다.\n${qa.kind === "jira" ? "Jira" : "문의 문서"}에는 아무것도 쓰지 않습니다. 계속할까요?`)) return;
    act = "answer"; params = { kind: qa.kind, query: qa.query, keys: [...qa.sel], to };
  } else if (sch) {
    const mode = $("qa_mode").value, days = [...$("qa_days").querySelectorAll("input:checked")].map(x => +x.value);
    act = "schedule"; params = { kind: qa.kind, query: qa.query, to: $("qa_to").value.trim(), label: $("qa_label").value.trim(), when: { mode, date: $("qa_date").value, time: $("qa_time").value, days } };
  } else if (now) {
    if (!confirm("이 예약을 지금 한 번 실행하고 메일을 보냅니다. 계속할까요?")) return;
    act = "run_now"; params = { id: now.dataset.qaNow };
  } else {
    if (!confirm("이 예약을 삭제할까요?")) return;
    act = "unschedule"; params = { id: del.dataset.qaDel };
  }
  const b = run || sch || now || del; b.disabled = true; const rel = holdBusy();
  const t0 = Date.now(), lbl = b.textContent, tick = setInterval(() => { if (b.isConnected) b.textContent = `실행 중… ${Math.round((Date.now() - t0) / 1000)}초`; }, 1000);
  const endProg = run || now ? startProg(bot.id, act, run ? "답변 만들기" : "예약 지금 실행") : () => {};
  const res = await api("/api/run", { bot: bot.id, action: act, params }).catch(() => ({ ok: false, text: "서버 연결 실패" }));
  clearInterval(tick); rel(); endProg(); b.textContent = lbl; b.disabled = false;
  if (res.view) showResult(res);
  else if (run || sch) { const box = $("result").querySelector(".qabox"); box.insertAdjacentHTML("beforeend", `<p class="status ${res.ok ? "ok" : "bad"}" style="white-space:pre-wrap">${esc(res.text || "")}</p>`); }
  else showResult(res);
  loadHistory();
});

async function loadLimits() {  // 상단 바: 계정 전체 5시간·주간 한도
  const r = await api("/api/limits").catch(() => null);
  const cards = (r && r.data && r.data.cards || []).filter(c => c.gauge);
  $("limits").innerHTML = cards.map(c => {
    const v = Number(c.value) || 0, lv = v >= 90 ? "crit" : v >= 70 ? "warn" : "";
    return `<div class="lim" title="${esc(c.sub || "")}">${esc(c.label.replace(" 한도", ""))} <b>${esc(c.value)}%</b><span class="bar"><i class="${lv}" style="width:${Math.min(v, 100)}%"></i></span><span class="sub">${esc((c.sub || "").replace("리셋 ", "↻ "))}</span></div>`;
  }).join("");
}
async function loadHistory() {
  const h = await api("/api/history").catch(() => []);
  $("histn").textContent = h.length ? h.length + "건" : "";
  $("hist").innerHTML = h.length ? h.map(r => `<div><time>${new Date(r.t * 1000).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false })}</time>
    <span>${r.ok ? "✅" : "⚠️"} ${esc(r.bot)} · ${esc(r.action)} <em>${esc(r.summary)}</em></span><em>${r.sec}초</em></div>`).join("")
    : '<p class="empty">아직 실행 기록이 없습니다.</p>';
  fitHist();
}
// 최근 실행: 5건 높이만 보이고 나머지는 목록 안에서 스크롤
function fitHist() {
  const el = $("hist"), rows = el.children;
  if (!el.offsetParent) return;
  if (rows.length <= 5) { el.style.maxHeight = ""; return; }

function pjSecSummary(dd) {

function pjSecTodo(dd) {

      ${kind !== "done" ? `<button class="btn pjsbtn ok" type="button" data-pjmark="done" data-tid="${esc(t.id)}" title="다 했으면 완료">✓ 완료</button>` : ""}

  const row = (t, kind) => `<div class="pjrow ${kind === "open" ? "" : kind}">
      <div class="main"><b>${esc(t.title)}</b> ${kind === "open" ? pjDue(t) : ""} ${kind === "open" && t.priority === "높음" ? `<span class="pjdue late">높음</span>` : ""}
        <span class="sub">${kind === "hold" ? `보류 ${esc((t.hold_at || "").slice(5, 16))} · ` : kind === "done" ? `완료 ${esc((t.done_at || "").slice(5, 16))} ${esc(t.done_by || "")} · ` : ""}${esc(t.why || "")}${t.link ? ` · <a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.src_label || "원문")}</a>` : ""} · ${esc((t.created || "").slice(5, 10))} 등록</span></div>

  return `<section class="pjsec"><h4>✅ 해야 할 일 <span class="pjn">${opn.length}</span>${hold.length ? ` <span class="pjn" style="background:#FFF4E5;color:#B54708">보류 ${hold.length}</span>` : ""}</h4>
    ${opn.length ? opn.map(t => row(t, "open")).join("") : `<p class="empty">열린 할 일이 없습니다.</p>`}

    ${hold.length ? `<details><summary>보류한 일 ${hold.length}건</summary>${hold.map(t => row(t, "hold")).join("")}</details>` : ""}
    ${done.length ? `<details><summary>완료한 일 ${done.length}건</summary>${done.slice(0, 30).map(t => row(t, "done")).join("")}</details>` : ""}</section>`;

  const r = await api("/api/run", { bot: "projects", action: "jira_transitions", params: { key } }).catch(() => null);
  const sel = $("pj_tr");
  if (sel) sel.innerHTML = `<option value="">바꾸지 않음</option>` + ((r && r.transitions) || []).map(t => `<option value="${esc(t.id)}">${esc(t.name)}${t.to && t.to !== t.name ? " → " + esc(t.to) : ""}</option>`).join("");
}
async function pjReply(mid) {
  pjDialog(`<div><div class="dh"><b id="pjdlgt">답장 초안</b><p>Claude가 메일과 프로젝트 상황을 읽고 초안을 쓰는 중입니다 (30초~1분)…</p></div><div class="db"><p class="status run">작성 중…</p></div>
    <div class="df"><span class="sp"></span><button class="btn" type="button" data-pjclose="1">닫기</button></div></div>`);
  const r = await api("/api/run", { bot: "projects", action: "reply_draft", params: { pid: pjSel, mail_id: mid } }).catch(() => ({ ok: false, text: "서버 연결 실패" }));
  if (!$("pjdlg").open) return;
  if (!r.ok) return pjDialog(`<div><div class="dh"><b id="pjdlgt">답장 초안</b></div><div class="db"><p class="status bad">${esc(r.text || "오류")}</p></div><div class="df"><span class="sp"></span><button class="btn" type="button" data-pjclose="1">닫기</button></div></div>`);
  const v = r.draft;
  pjDialog(`<div><div class="dh"><b id="pjdlgt">답장 초안 — ${esc(v.subject)}</b><p>받는 사람: ${pjWho(v.to)} · 보내지 않았습니다. 고친 뒤 복사해서 메일에 붙여 넣으세요. [확인 필요] 표시는 직접 채워 주세요.</p></div>
    <div class="db"><textarea class="pjdraft" id="pj_draft" aria-label="답장 초안">${esc(v.text)}</textarea></div>
    <div class="df"><a class="btn" href="${esc(v.link)}" target="_blank" rel="noopener">Gmail에서 열기</a><span class="sp"></span>
      <button class="btn" type="button" data-pjclose="1">닫기</button><button class="btn primary" type="button" data-pjcopy="1">복사</button></div></div>`);
}
async function pjPreview(path) {
  if (pjPrev && pjPrev.path === path) { pjPrev = null; return pjRender(); }
  pjPrev = { path, data: null }; pjSheet = 0; pjRender();
  const r = await api("/api/run", { bot: "projects", action: "preview", params: { path } }).catch(() => ({ ok: false, text: "서버 연결 실패" }));
  if (!pjPrev || pjPrev.path !== path) return;
  pjPrev.data = r.ok ? r.preview : { kind: "none", name: path.split(/[\\/]/).pop(), text: r.text || "미리보기 실패" };
  pjRender();
}
document.addEventListener("click", async e => {
  if (!pjMode()) return;
  const t = e.target.closest("[data-pjsel],[data-pjnew],[data-pjsched],[data-pjedit],[data-pjmove],[data-pjtab],[data-pjrefresh],[data-pjdone],[data-pjundo],[data-pjtdel],[data-pjmark],[data-pjatt],[data-pjreply],[data-pjjira],[data-pjprev],[data-pjprevclose],[data-pjopen],[data-pjlink],[data-pjunlink],[data-pjsheet]");
  if (!t || !($("pjmain").contains(t) || $("pjside").contains(t))) return;
  const ds = t.dataset;
  if (ds.pjsel !== undefined) { pjSel = ds.pjsel; pjPrev = null; pjTab = "all"; try { localStorage.setItem("pjSel", pjSel); } catch (_) {} pjRender(); return scrollTo({ top: 0 }); }
  if (ds.pjtab) { pjTab = ds.pjtab; pjRender(); return $("pjmain").querySelector(".pjnav")?.scrollIntoView({ block: "nearest" }); }
  if (ds.pjnew) return pjEdit(null);
  if (ds.pjsched) { if ((pj.schedule || {}).startup) return alert("PC를 켜고 로그인하면 업무봇이 자동으로 열리고 프로젝트 대응·업무 도구를 전부 새로 받아옵니다.\n(작업 스케줄러 IoTWorkBot_Startup · 기록 runs\\startup.log)"); return pjSched(); }
  if (ds.pjedit) return pjEdit(pjCur());
  if (ds.pjmove) return pjCall("move_project", { step: +ds.pjmove });
  if (ds.pjrefresh !== undefined) return pjCall("refresh", { pid: ds.pjrefresh });
  if (ds.pjdone) { e.preventDefault(); return pjCall("mark", { tid: ds.pjdone, status: "done" }); }
  if (ds.pjundo) { e.preventDefault(); return pjCall("mark", { tid: ds.pjundo, status: "open" }); }
  if (ds.pjtdel) { if (confirm("이 할 일을 지울까요? (할 일이 아닌 경우)")) pjCall("mark", { tid: ds.pjtdel, status: "delete" }); return; }
  if (ds.pjmark) { if (ds.pjmark === "delete" && !confirm("안 해도 되는 일로 보고 목록에서 지울까요?")) return; return pjCall("mark", { tid: ds.tid, status: ds.pjmark }); }
  if (ds.pjreply) return pjReply(ds.pjreply);
  if (ds.pjjira) return pjJira(ds.pjjira, ds.sum, ds.st);
  if (ds.pjprevclose) { pjPrev = null; return pjRender(); }
  if (ds.pjsheet !== undefined) { pjSheet = +ds.pjsheet; return pjRender(); }
  if (ds.pjprev) { if (t.classList.contains("pjatt")) pjTab = "files"; return pjPreview(ds.pjprev); }
  if (ds.pjopen) { const r = await api("/api/run", { bot: "projects", action: "open_file", params: { path: ds.pjopen } }).catch(() => null); return pjMsg(r && r.ok ? "ok" : "bad", r && r.ok ? "파일을 열었습니다 (작업 표시줄을 확인하세요)" : (r && r.text) || "열기 실패"); }
  if (ds.pjlink) return pjCall("link_file", { path: ds.pjlink, on: true }, "연결 중…");
  if (ds.pjunlink) return pjCall("link_file", { path: ds.pjunlink, on: false }, "빼는 중…");
  if (ds.pjatt) {
    pjMsg("run", `첨부 받는 중: ${ds.name}`);
    const r = await pjCall("attachment", { mail_id: ds.mail, att: ds.pjatt, name: ds.name });
    if (r && r.ok) { pjPrev = { path: r.path, data: r.preview }; pjSheet = 0; pjTab = "files"; pjRender(); pjMsg("ok", r.text); $("pjmain").querySelector(".pjprev")?.scrollIntoView({ block: "nearest" }); }
  }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-pjaddtodo]");
  if (!f || !pjMode()) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  if (v.title.trim()) pjCall("add_todo", v, "추가 중…");
});
$("pjdlg").addEventListener("click", async e => {
  const t = e.target;
  if (t === $("pjdlg") || t.dataset.pjclose) return $("pjdlg").close();
  if (t.dataset.pjcopy) { const a = $("pj_draft"); a.select(); try { await navigator.clipboard.writeText(a.value); } catch (_) { document.execCommand("copy"); } t.textContent = "복사됨 ✓"; return; }
  if (t.dataset.pjdel) {
    if (!confirm("이 프로젝트를 지울까요? (메일·Jira·할 일 기록은 남지만 목록에서 사라집니다)")) return;
    $("pjdlg").close(); pjCall("delete_project", { pid: t.dataset.pjdel });
  }
});
$("pjdlg").addEventListener("submit", async e => {
  const f = e.target.closest("[data-pjform]");
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f)), btn = f.querySelector("[type=submit]");
  if (f.dataset.pjform === "sched") {
    btn.disabled = true;
    const r = await pjCall("schedule", { on: !!v.on, at: v.at }, "등록 중…");
    btn.disabled = false;
    if (r && r.ok) $("pjdlg").close(); else alert((r && r.text) || "등록 실패");
    return;
  }
  if (f.dataset.pjform === "jira") {
    if (!v.comment.trim() && !v.transition) return alert("댓글을 쓰거나 바꿀 상태를 고르세요");
    btn.disabled = true; btn.textContent = "반영 중…";
    const r = await api("/api/run", { bot: "projects", action: "jira_do", params: v }).catch(() => ({ ok: false, text: "서버 연결 실패" }));
    btn.disabled = false; btn.textContent = "Jira에 반영";
    if (!r.ok) return alert(r.text || "Jira 반영 실패");
    $("pjdlg").close(); pjMsg("ok", r.text + " — 화면 기록은 다음 [새로 확인] 때 갱신됩니다"); loadHistory();
    return;
  }
  btn.disabled = true;
  const r = await pjCall("save_project", { ...v, pid: v.id });
  btn.disabled = false;
  if (r && r.ok) { if (!v.id) { pjSel = r.data.sel; try { localStorage.setItem("pjSel", pjSel); } catch (_) {} pjRender(); } $("pjdlg").close(); }
});
function pjSched() {
  const sc = (pj && pj.schedule) || {};
  pjDialog(`<form method="dialog" data-pjform="sched"><div class="dh"><b id="pjdlgt">매일 아침 자동 확인</b>
    <p>정한 시각에 모든 프로젝트를 [새로 확인]합니다 — 새 메일·Jira 변경 요약과 할 일 갱신, 메일 첨부를 다운로드 폴더(IoT업무봇\\프로젝트 이름)에 받기, 다운로드 폴더 파일 연결까지.</p></div>
    <div class="db">
      <label class="check"><input type="checkbox" name="on"${sc.on || !sc.next && !sc.last ? " checked" : ""}>매일 자동으로 확인</label>
      <div class="row"><label for="pj_at">실행 시각 (HH:MM)</label><input type="text" id="pj_at" name="at" value="${esc(sc.at || "08:20")}" inputmode="numeric" pattern="[0-2][0-9]:[0-5][0-9]">
        <div class="help">PC가 켜져 있어야 합니다. 그 시각에 꺼져 있었으면 켠 뒤 바로 실행합니다. 업무봇 화면은 닫혀 있어도 됩니다. 내 할 일(08:10)과 겹치지 않게 기본 08:20.</div></div>
      ${sc.next ? `<p class="muted">다음 실행: ${esc(sc.next)}</p>` : ""}${sc.last ? `<p class="muted">마지막 기록: ${esc(sc.last)}</p>` : ""}
    </div>
    <div class="df"><span class="sp"></span><button class="btn" type="button" data-pjclose="1">취소</button><button class="btn primary" type="submit">저장</button></div></form>`);
}

// 왼쪽 프로젝트 목록 끌어서 순서 바꾸기
let pjDragId = "";
const pjDropClear = () => $("pjside").querySelectorAll(".drop-before,.drop-after").forEach(x => x.classList.remove("drop-before", "drop-after"));
$("pjside").addEventListener("dragstart", e => {
  const it = e.target.closest(".pjitem[data-pjsel]");
  if (!it) return;
  pjDragId = it.dataset.pjsel;
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", pjDragId); } catch (_) {}
  requestAnimationFrame(() => it.classList.add("dragging"));
});
$("pjside").addEventListener("dragover", e => {
  if (!pjDragId) return;
  const it = e.target.closest(".pjitem[data-pjsel]");
  if (!it || it.dataset.pjsel === pjDragId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  const r = it.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  pjDropClear();
  it.classList.add(after ? "drop-after" : "drop-before");
});
$("pjside").addEventListener("dragleave", e => { if (!$("pjside").contains(e.relatedTarget)) pjDropClear(); });
$("pjside").addEventListener("drop", e => {
  const it = e.target.closest(".pjitem[data-pjsel]");
  if (!pjDragId || !it) return;
  e.preventDefault();
  const after = it.classList.contains("drop-after"), to = it.dataset.pjsel, from = pjDragId;
  pjDropClear();
  if (to === from || !pj) return;
  const list = pj.projects.slice(), moved = list.splice(list.findIndex(x => x.id === from), 1)[0];
  list.splice(list.findIndex(x => x.id === to) + (after ? 1 : 0), 0, moved);
  pj.projects = list; pjRender();  // 화면은 바로 바꾸고 저장은 뒤에서
  pjCall("reorder", { ids: list.map(x => x.id) }).then(r => { if (!r || !r.ok) pjLoad(); });
});
$("pjside").addEventListener("dragend", () => { pjDragId = ""; pjDropClear(); $("pjside").querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging")); });

// 처음 열 때: 마지막으로 보던 화면 (기본은 프로젝트 대응)
(() => { let m = "pj"; try { m = localStorage.getItem("hub.mode") || "pj"; } catch (e) {} setMode(m); })();
</script>
